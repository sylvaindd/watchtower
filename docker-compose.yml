version: '3.7'

services:
  watchtower:
    container_name: watchtower
    build:
      context: ./
      dockerfile: dockerfiles/Dockerfile.dev-self-contained
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 8080:8080
    environment:
      # Declare a named schedule "frequent" that demo containers can reference
      # via the com.centurylinklabs.watchtower.schedule-name label.
      WATCHTOWER_SCHEDULE_NAMED_FREQUENT: "@every 20s"
    command: --interval 10 --http-api-metrics --http-api-token demotoken --debug prometheus grafana parent child scheduled-named scheduled-inline
  prometheus:
    container_name: prometheus
    image: prom/prometheus
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus:/prometheus/
    ports:
      - 9090:9090
  grafana:
    container_name: grafana
    image: grafana/grafana
    ports:
      - 3000:3000
    environment:
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning
  parent:
    image: nginx
    container_name: parent
  child:
    image: nginx:alpine
    labels:
      com.centurylinklabs.watchtower.depends-on: parent
    container_name: child
  scheduled-named:
    image: nginx:alpine
    container_name: scheduled-named
    labels:
      # Checked on the "frequent" named schedule declared on the watchtower service
      com.centurylinklabs.watchtower.schedule-name: frequent
  scheduled-inline:
    image: nginx:alpine
    container_name: scheduled-inline
    labels:
      # Checked on its own inline cron schedule (overrides the global --interval)
      com.centurylinklabs.watchtower.schedule: "@every 45s"

volumes:
  prometheus: {}
  grafana: {}
